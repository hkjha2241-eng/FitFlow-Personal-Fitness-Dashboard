<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopDynamic - E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shop-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ShopDynamic</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a class="nav-link text-white" href="#products">Home</a>
                <a class="nav-link text-white" href="#products">Shop</a>
                <button class="btn btn-light position-relative" id="cartToggle" type="button">
                    Cart <span class="badge text-bg-success" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="row g-4">
            <section class="col-lg-9" id="products">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                    <div>
                        <h1 class="h3 mb-1">Our Products</h1>
                        <p class="text-muted mb-0">Find the right product for you.</p>
                    </div>
                    <select class="form-select category-select mt-2 mt-sm-0" id="categoryFilter" aria-label="Filter products">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div class="row g-3" id="productList"></div>
            </section>

            <aside class="col-lg-3" id="cartSection">
                <div class="cart-panel">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                        <h2 class="h5 mb-0">Shopping Cart</h2>
                        <button class="btn-close" id="cartClose" aria-label="Close cart"></button>
                    </div>
                    <div id="cartItems">
                        <p class="text-muted text-center py-4">Your cart is empty.</p>
                    </div>
                    <div class="cart-summary mt-3 pt-3 border-top">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Items</span><strong id="itemCount">0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Grand Total</span><strong id="grandTotal">₹0</strong>
                        </div>
                        <button class="btn btn-success w-100" id="checkoutBtn" type="button">Proceed to Checkout</button>
                        <p class="small text-muted mt-2 mb-0" id="checkoutMessage"></p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div class="toast" id="messageToast" role="status">
            <div class="toast-body" id="toastText"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
